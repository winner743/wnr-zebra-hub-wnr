<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GitHub Website Deployer · Deploy + AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',sans-serif;
    background:#0b0b12;
    color:#e2e8f0;
    min-height:100vh;
    padding:1.5rem 1rem;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(99,102,241,.15), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(168,85,247,.12), transparent 40%);
  }
  .wrap { max-width:920px; margin:0 auto; }

  /* Hero */
  .hero { text-align:center; margin-bottom:1.5rem; }
  .hero-icon {
    width:60px; height:60px; margin:0 auto .8rem;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.7rem; color:#fff;
    box-shadow:0 15px 35px -10px rgba(99,102,241,.6);
  }
  .hero h1 {
    font-size:1.7rem;
    background:linear-gradient(135deg,#a5b4fc,#c084fc);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; margin-bottom:.3rem;
  }
  .hero p { color:#94a3b8; font-size:.85rem; }

  /* Saved badge */
  .saved-badge {
    display:none;
    justify-content:center;
    align-items:center;
    gap:.4rem;
    margin:.6rem auto 0;
    padding:.4rem 1rem;
    width:fit-content;
    background:rgba(16,185,129,.15);
    border:1px solid rgba(16,185,129,.35);
    border-radius:50px;
    font-size:.75rem;
    color:#86efac;
  }
  .saved-badge.show { display:inline-flex; }
  .saved-badge button {
    background:none; border:none; color:#86efac;
    cursor:pointer; font-size:.7rem;
    text-decoration:underline; padding:0;
  }

  /* Tabs */
  .tabs {
    display:flex;
    gap:.5rem;
    margin-bottom:1.2rem;
    background:rgba(20,20,30,.6);
    padding:.4rem;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.06);
  }
  .tab {
    flex:1;
    padding:.75rem 1rem;
    border-radius:10px;
    background:transparent;
    border:none;
    color:#94a3b8;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    transition:all .2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
  }
  .tab.active {
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;
    box-shadow:0 8px 20px -8px rgba(99,102,241,.6);
  }
  .tab:hover:not(.active) { color:#c7d2fe; background:rgba(255,255,255,.04); }
  .tab i { font-size:.9rem; }

  /* Tab panels */
  .panel { display:none; animation:fadeIn .3s; }
  .panel.active { display:block; }

  /* Card */
  .card {
    background:rgba(20,20,30,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:1.5rem;
    margin-bottom:1rem;
    box-shadow:0 25px 50px -15px rgba(0,0,0,.6);
  }

  /* Fields */
  .field { margin-bottom:1rem; }
  .field:last-child { margin-bottom:0; }
  label {
    display:flex; align-items:center; gap:.45rem;
    font-size:.72rem; font-weight:600;
    text-transform:uppercase; letter-spacing:.06em;
    color:#94a3b8; margin-bottom:.45rem;
  }
  label i { color:#818cf8; font-size:.85rem; }

  .input-box { position:relative; }
  .input-box input, .input-box textarea {
    width:100%;
    padding:.8rem 2.7rem .8rem 1rem;
    background:rgba(0,0,0,.45);
    border:1.5px solid rgba(255,255,255,.08);
    border-radius:12px;
    color:#e2e8f0;
    font-family:'JetBrains Mono',monospace;
    font-size:.85rem;
    outline:none;
    transition:all .2s;
  }
  .input-box textarea {
    padding:.8rem 1rem;
    min-height:220px;
    resize:vertical;
    line-height:1.55;
    font-size:.78rem;
  }
  .input-box input:focus, .input-box textarea:focus {
    border-color:#818cf8;
    box-shadow:0 0 0 4px rgba(129,140,248,.15);
  }
  .input-box .toggle {
    position:absolute; right:.8rem; top:1.5rem;
    background:none; border:none;
    color:#64748b; cursor:pointer;
    font-size:1rem; padding:.25rem;
    transition:color .2s;
  }
  .input-box .toggle:hover { color:#a5b4fc; }

  .hint {
    font-size:.7rem; color:#64748b;
    margin-top:.35rem; display:flex; align-items:center; gap:.35rem;
  }

  /* Buttons */
  .btn-row { display:flex; gap:.6rem; margin-top:1.2rem; flex-wrap:wrap; }
  button.action {
    flex:1; min-width:120px;
    padding:.85rem 1.3rem;
    border:none; border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:600; font-size:.85rem;
    cursor:pointer; transition:all .2s;
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    white-space:nowrap;
  }
  .btn-primary {
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;
    box-shadow:0 10px 25px -8px rgba(99,102,241,.6);
  }
  .btn-primary:hover:not(:disabled) {
    transform:translateY(-2px);
    box-shadow:0 15px 30px -8px rgba(99,102,241,.8);
  }
  .btn-deploy {
    background:linear-gradient(135deg,#10b981,#059669);
    color:#fff;
    box-shadow:0 10px 25px -8px rgba(16,185,129,.5);
  }
  .btn-deploy:hover:not(:disabled) {
    transform:translateY(-2px);
    box-shadow:0 15px 30px -8px rgba(16,185,129,.7);
  }
  .btn-purple {
    background:linear-gradient(135deg,#8b5cf6,#d946ef);
    color:#fff;
    box-shadow:0 10px 25px -8px rgba(139,92,246,.5);
  }
  .btn-purple:hover:not(:disabled) {
    transform:translateY(-2px);
    box-shadow:0 15px 30px -8px rgba(139,92,246,.7);
  }
  .btn-secondary {
    background:rgba(255,255,255,.05);
    color:#e2e8f0;
    border:1.5px solid rgba(255,255,255,.1);
  }
  .btn-secondary:hover { background:rgba(255,255,255,.1); }
  .btn-sm { padding:.5rem .9rem; font-size:.78rem; min-width:auto; flex:0; }
  button:disabled { opacity:.5; cursor:not-allowed; transform:none !important; }

  /* Spinner */
  .spinner {
    width:15px; height:15px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Console */
  .console {
    background:#050508;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:1rem 1.1rem;
    font-family:'JetBrains Mono',monospace;
    font-size:.76rem;
    max-height:240px;
    overflow-y:auto;
    line-height:1.65;
  }
  .console-header {
    display:flex; gap:.5rem; align-items:center;
    padding-bottom:.5rem; margin-bottom:.5rem;
    border-bottom:1px solid rgba(255,255,255,.06);
    color:#64748b; font-size:.7rem;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .line { display:flex; gap:.6rem; padding:.1rem 0; word-break:break-word; }
  .time { color:#475569; flex-shrink:0; }
  .msg.info    { color:#a5b4fc; }
  .msg.success { color:#86efac; }
  .msg.error   { color:#fca5a5; }
  .msg.warn    { color:#fde047; }
  .console::-webkit-scrollbar { width:7px; }
  .console::-webkit-scrollbar-track { background:#0b0b12; }
  .console::-webkit-scrollbar-thumb { background:#334155; border-radius:6px; }

  /* Result */
  .result {
    display:none;
    margin-top:1rem;
    padding:1.1rem;
    background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(99,102,241,.12));
    border:1.5px solid rgba(16,185,129,.4);
    border-radius:14px;
    animation:fadeIn .4s;
  }
  .result.show { display:block; }
  .result-title {
    display:flex; align-items:center; gap:.5rem;
    color:#86efac; font-weight:600; margin-bottom:.6rem;
    font-size:.9rem;
  }
  .result a {
    color:#a5b4fc;
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    word-break:break-all;
    text-decoration:none;
  }
  .result a:hover { text-decoration:underline; }

  /* Preview iframe */
  .preview-box {
    margin-top:1rem;
    border-radius:14px;
    overflow:hidden;
    border:1.5px solid rgba(255,255,255,.08);
    background:#fff;
    height:0;
    transition:height .3s;
  }
  .preview-box.show { height:420px; }
  .preview-box iframe {
    width:100%; height:100%; border:none;
    background:#fff;
  }
  .preview-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:.6rem 1rem;
    background:rgba(15,23,42,.9);
    color:#94a3b8;
    font-size:.75rem;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .preview-header i { color:#86efac; }

  /* AI suggest */
  .ai-suggestions {
    display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem;
  }
  .ai-chip {
    padding:.4rem .8rem;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(139,92,246,.3);
    border-radius:50px;
    color:#c4b5fd;
    font-size:.72rem;
    cursor:pointer;
    transition:all .2s;
    font-family:'Inter',sans-serif;
  }
  .ai-chip:hover {
    background:rgba(139,92,246,.25);
    color:#e9d5ff;
    transform:translateY(-1px);
  }

  /* Toast */
  .toast {
    position:fixed; bottom:2rem; left:50%;
    transform:translateX(-50%) translateY(0);
    background:rgba(15,23,42,.95);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    padding:.8rem 1.5rem;
    border-radius:50px;
    font-size:.82rem; font-weight:500;
    display:flex; align-items:center; gap:.55rem;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.5);
    backdrop-filter:blur(10px);
    opacity:1; transition:all .3s;
    z-index:999;
  }
  .toast.hide {
    opacity:0;
    transform:translateX(-50%) translateY(20px);
    pointer-events:none;
  }
  .toast i { color:#86efac; }
  .toast.error i { color:#fca5a5; }

  @keyframes fadeIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  code {
    background:rgba(129,140,248,.15);
    padding:.1rem .35rem;
    border-radius:4px;
    color:#c7d2fe;
    font-size:.85em;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-icon"><i class="fa-brands fa-github"></i></div>
    <h1>GitHub Website Deployer</h1>
    <p>Deploy your site or let AI build it for you</p>
    <div class="saved-badge" id="savedBadge">
      <i class="fa-solid fa-floppy-disk"></i>
      <span>Token saved locally</span>
      <button id="forgetToken">Forget</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="deploy">
      <i class="fa-solid fa-rocket"></i> Deploy
    </button>
    <button class="tab" data-tab="ai">
      <i class="fa-solid fa-wand-magic-sparkles"></i> AI Builder
    </button>
  </div>

  <!-- ============ DEPLOY PANEL ============ -->
  <div class="panel active" id="panel-deploy">

    <div class="card">
      <div class="field">
        <label><i class="fa-solid fa-key"></i> GitHub Token <span style="color:#86efac; font-size:.65rem; margin-left:auto;" id="tokenStatus"></span></label>
        <div class="input-box">
          <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false"/>
          <button class="toggle" id="toggleToken" type="button">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="hint"><i class="fa-solid fa-lock"></i> Auto-saved in your browser only.</div>
      </div>

      <div class="field">
        <label><i class="fa-solid fa-globe"></i> Website Name</label>
        <div class="input-box">
          <input type="text" id="siteName" placeholder="my-awesome-site" autocomplete="off" spellcheck="false"/>
        </div>
      </div>

      <div class="field">
        <label>
          <i class="fa-solid fa-file-code"></i> Website Code (index.html)
          <span style="margin-left:auto; display:flex; gap:.4rem;">
            <button class="action btn-secondary btn-sm" id="previewBtn" type="button" style="flex:0;">
              <i class="fa-solid fa-eye"></i> Preview
            </button>
          </span>
        </label>
        <div class="input-box">
          <textarea id="siteCode" spellcheck="false"><!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 4rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      min-height: 100vh;
      margin: 0;
    }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    p  { font-size: 1.2rem; opacity: 0.9; }
  </style>
</head>
<body>
  <h1>🚀 It works!</h1>
  <p>This website is hosted on GitHub Pages.</p>
</body>
</html></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="action btn-primary" id="requestBtn">
          <i class="fa-solid fa-key"></i> Save & Verify Token
        </button>
        <button class="action btn-deploy" id="deployBtn" disabled>
          <i class="fa-solid fa-rocket"></i> Deploy Website
        </button>
        <button class="action btn-secondary" id="clearBtn">
          <i class="fa-solid fa-eraser"></i> Clear
        </button>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-box" id="previewBox">
      <div class="preview-header">
        <span><i class="fa-solid fa-eye"></i> Live Preview</span>
        <button class="action btn-secondary btn-sm" id="closePreview" style="flex:0; padding:.3rem .7rem; font-size:.7rem;">
          <i class="fa-solid fa-xmark"></i> Close
        </button>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <!-- Console -->
    <div class="card">
      <div class="console" id="console">
        <div class="console-header">
          <i class="fa-solid fa-terminal"></i> Console Output
        </div>
        <div id="log"></div>
      </div>

      <div class="result" id="result">
        <div class="result-title">
          <i class="fa-solid fa-circle-check"></i> Website Deployed Successfully
        </div>
        <div style="color:#94a3b8; font-size:.75rem; margin-bottom:.4rem;">🌐 Live URL (may take 1-2 min to publish):</div>
        <a id="liveUrl" href="#" target="_blank"></a>
      </div>
    </div>

  </div>

  <!-- ============ AI PANEL ============ -->
  <div class="panel" id="panel-ai">

    <div class="card">
      <div class="field">
        <label><i class="fa-solid fa-wand-magic-sparkles"></i> Describe Your Website</label>
        <div class="input-box">
          <textarea id="aiPrompt" style="min-height:100px;" placeholder="Example: A modern landing page for a coffee shop with hero section, menu, and contact form."></textarea>
        </div>
        <div class="ai-suggestions" id="aiChips">
          <button class="ai-chip" data-prompt="A modern portfolio website with hero, about, projects, and contact sections. Dark theme with gradient accents.">💼 Portfolio</button>
          <button class="ai-chip" data-prompt="A landing page for a SaaS product with features grid, pricing table, and call-to-action.">🚀 SaaS Landing</button>
          <button class="ai-chip" data-prompt="A cozy restaurant website with hero image, menu, gallery, and reservation form.">🍽️ Restaurant</button>
          <button class="ai-chip" data-prompt="A personal blog homepage with post cards, categories sidebar, and newsletter signup.">📝 Blog</button>
          <button class="ai-chip" data-prompt="A coming soon page with countdown timer and email signup.">⏳ Coming Soon</button>
          <button class="ai-chip" data-prompt="A photography gallery with masonry grid layout and lightbox effect.">📸 Gallery</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="action btn-purple" id="aiGenerateBtn">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Website
        </button>
        <button class="action btn-secondary" id="aiClearBtn">
          <i class="fa-solid fa-eraser"></i> Clear
        </button>
      </div>
    </div>

    <!-- AI Output -->
    <div class="card" id="aiOutputCard" style="display:none;">
      <div class="field">
        <label>
          <i class="fa-solid fa-code"></i> Generated Code
          <span style="margin-left:auto; display:flex; gap:.4rem;">
            <button class="action btn-secondary btn-sm" id="aiPreviewBtn" type="button" style="flex:0;">
              <i class="fa-solid fa-eye"></i> Preview
            </button>
          </span>
        </label>
        <div class="input-box">
          <textarea id="aiCode" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="action btn-primary" id="aiTempelBtn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Auto-Paste to Deploy
        </button>
        <button class="action btn-deploy" id="aiDeployBtn">
          <i class="fa-solid fa-rocket"></i> Deploy Now
        </button>
      </div>
    </div>

    <!-- AI Preview -->
    <div class="preview-box" id="aiPreviewBox">
      <div class="preview-header">
        <span><i class="fa-solid fa-eye"></i> Live Preview</span>
        <button class="action btn-secondary btn-sm" id="aiClosePreview" style="flex:0; padding:.3rem .7rem; font-size:.7rem;">
          <i class="fa-solid fa-xmark"></i> Close
        </button>
      </div>
      <iframe id="aiPreviewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

  </div>

</div>

<!-- Toast -->
<div class="toast hide" id="toast">
  <i class="fa-regular fa-circle-check"></i>
  <span id="toastText">Done</span>
</div>

<script>
const $ = id => document.getElementById(id);
const API = "https://api.github.com";
const STORAGE_KEY = "gh_token_v1";

/* ============ Toast ============ */
let toastTimer;
function toast(msg, isError = false) {
  $('toastText').textContent = msg;
  $('toast').classList.remove('hide');
  $('toast').classList.toggle('error', isError);
  $('toast').querySelector('i').className = isError
    ? 'fa-regular fa-circle-xmark'
    : 'fa-regular fa-circle-check';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.add('hide'), 2500);
}

/* ============ Console logger ============ */
function log(msg, type = 'info') {
  const t = new Date().toTimeString().slice(0, 8);
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML = `<span class="time">[${t}]</span><span class="msg ${type}">${msg}</span>`;
  $('log').appendChild(line);
  $('console').scrollTop = $('console').scrollHeight;
}

/* ============ TOKEN SAVE / LOAD ============ */
function loadToken() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    $('token').value = saved;
    $('savedBadge').classList.add('show');
    $('tokenStatus').textContent = '· loaded';
    // Auto-verify
    setTimeout(() => verifyToken(true), 300);
  }
}

function saveToken(token) {
  if (token) {
    localStorage.setItem(STORAGE_KEY, token);
    $('savedBadge').classList.add('show');
    $('tokenStatus').textContent = '· saved';
  } else {
    localStorage.removeItem(STORAGE_KEY);
    $('savedBadge').classList.remove('show');
    $('tokenStatus').textContent = '';
  }
}

$('forgetToken').addEventListener('click', () => {
  saveToken('');
  $('token').value = '';
  $('deployBtn').disabled = true;
  toast('Token forgotten');
});

/* ============ Toggle token ============ */
$('toggleToken').addEventListener('click', () => {
  const inp = $('token');
  const isPw = inp.type === 'password';
  inp.type = isPw ? 'text' : 'password';
  $('toggleToken').querySelector('i').className =
    isPw ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

/* ============ Tabs ============ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $('panel-' + tab.dataset.tab).classList.add('active');
  });
});

/* ============ Base64 (UTF-8 safe) ============ */
function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

/* ============ GitHub API helpers ============ */
function headers(token) {
  return {
    "Authorization": `token ${token}`,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  };
}

async function getUser(token) {
  const r = await fetch(`${API}/user`, { headers: headers(token) });
  if (!r.ok) throw new Error(`Invalid token (${r.status})`);
  return r.json();
}

async function ensureRepo(token, owner, repo) {
  const check = await fetch(`${API}/repos/${owner}/${repo}`, { headers: headers(token) });
  if (check.status === 200) {
    log(`✅ Repo <b>${owner}/${repo}</b> already exists.`, 'success');
    return false;
  }
  log(`🆕 Creating repository <b>${repo}</b>...`, 'info');
  const create = await fetch(`${API}/user/repos`, {
    method: "POST",
    headers: headers(token),
    body: JSON.stringify({
      name: repo,
      private: false,
      auto_init: true,
      description: `Website deployed via GitHub Pages`
    })
  });
  if (!create.ok) {
    const err = await create.json().catch(() => ({}));
    throw new Error(`Create repo failed: ${err.message || create.status}`);
  }
  log(`✅ Repository created.`, 'success');
  await new Promise(r => setTimeout(r, 2000));
  return true;
}

async function uploadFile(token, owner, repo, path, content) {
  const get = await fetch(`${API}/repos/${owner}/${repo}/contents/${path}`, { headers: headers(token) });
  const sha = get.status === 200 ? (await get.json()).sha : null;

  const body = {
    message: `Deploy ${path}`,
    content: toBase64(content)
  };
  if (sha) body.sha = sha;

  const put = await fetch(`${API}/repos/${owner}/${repo}/contents/${path}`, {
    method: "PUT",
    headers: headers(token),
    body: JSON.stringify(body)
  });
  if (!put.ok) {
    const err = await put.json().catch(() => ({}));
    throw new Error(`Upload ${path} failed: ${err.message || put.status}`);
  }
  log(`📤 Uploaded <b>${path}</b>`, 'success');
}

async function enablePages(token, owner, repo) {
  log(`⚙️  Enabling GitHub Pages...`, 'info');
  const r = await fetch(`${API}/repos/${owner}/${repo}/pages`, {
    method: "POST",
    headers: headers(token),
    body: JSON.stringify({
      source: { branch: "main", path: "/" }
    })
  });
  if (r.status === 201) log(`🌐 GitHub Pages enabled.`, 'success');
  else if (r.status === 409) log(`ℹ️  Pages already enabled.`, 'info');
  else log(`⚠️  Pages setup returned ${r.status} (may already be active)`, 'warn');
}

/* ============ VERIFY TOKEN ============ */
async function verifyToken(silent = false) {
  const token = $('token').value.trim();
  if (!token) {
    if (!silent) toast('Enter your token first', true);
    return false;
  }
  try {
    if (!silent) {
      $('requestBtn').disabled = true;
      $('requestBtn').innerHTML = '<div class="spinner"></div> Verifying...';
      log(`🔐 Verifying GitHub token...`, 'info');
    }
    const user = await getUser(token);
    log(`✅ Token valid for <b>${user.login}</b>`, 'success');
    if (!silent) toast(`Token verified: ${user.login}`);

    // Save token
    saveToken(token);

    // Enable deploy
    $('deployBtn').disabled = false;
    return true;
  } catch (err) {
    log(`❌ ${err.message}`, 'error');
    if (!silent) toast(err.message, true);
    saveToken('');
    return false;
  } finally {
    if (!silent) {
      $('requestBtn').disabled = false;
      $('requestBtn').innerHTML = '<i class="fa-solid fa-key"></i> Save & Verify Token';
    }
  }
}

$('requestBtn').addEventListener('click', () => verifyToken(false));

$('previewBtn').addEventListener('click', () => {
  const code = $('siteCode').value;

  $('previewFrame').srcdoc = code;
  $('previewBox').classList.add('show');

});
$('closePreview').addEventListener('click', () => {

});

/* ============ DEPLOY ============ */
async function deploySite(token, name, code) {
  const repoName = name.toLowerCase().replace(/[^a-z0-9-_]/g, '-');
  if (repoName !== name.toLowerCase()) {
    log(`ℹ️  Repo name sanitized: <b>${repoName}</b>`, 'info');
  }

  log(`🚀 Starting deployment for <b>${name}</b>...`, 'info');

  const user  = await getUser(token);
  const owner = user.login;
  log(`👤 Owner: <b>${owner}</b>`, 'info');

  await ensureRepo(token, owner, repoName);
  await uploadFile(token, owner, repoName, "index.html", code);
  await uploadFile(token, owner, repoName, "README.md", `# ${name}\n\nHosted on GitHub Pages.\n`);
  await enablePages(token, owner, repoName);

  const liveUrl = `https://${owner}.github.io/${repoName}/`;
  $('liveUrl').href = liveUrl;
  $('liveUrl').textContent = liveUrl;
  $('result').classList.add('show');

  log(`🎉 Deployment complete!`, 'success');
  log(`🌐 Live URL: <a href="${liveUrl}" target="_blank" style="color:#a5b4fc">${liveUrl}</a>`, 'success');
  log(`⏳ GitHub Pages may take 1-2 minutes to publish.`, 'warn');

  toast('Website deployed successfully!');
  return liveUrl;
}

$('deployBtn').addEventListener('click', async () => {
  const token = $('token').value.trim();
  const name  = $('siteName').value.trim();
  const code  = $('siteCode').value;

  if (!token) { toast('Token is required', true); return; }
  if (!name)  { toast('Website name is required', true); return; }
  if (!code.trim()) { toast('Website code is empty', true); return; }

  $('deployBtn').disabled = true;
  $('deployBtn').innerHTML = '<div class="spinner"></div> Deploying...';
  $('result').classList.remove('show');

  try {
    await deploySite(token, name, code);
    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (err) {
    log(`❌ ${err.message}`, 'error');
    toast(err.message, true);
  } finally {
    $('deployBtn').disabled = false;
    $('deployBtn').innerHTML = '<i class="fa-solid fa-rocket"></i> Deploy Website';
  }
});

function generateWebsite(prompt) {
  const p = prompt.toLowerCase();

  // Detect type
  if (p.includes('portfolio')) return buildPortfolio(prompt);
  if (p.includes('saas') || p.includes('landing')) return buildSaaS(prompt);
  if (p.includes('restaurant') || p.includes('cafe') || p.includes('coffee')) return buildRestaurant(prompt);
  if (p.includes('blog')) return buildBlog(prompt);
  if (p.includes('coming soon') || p.includes('countdown')) return buildComingSoon(prompt);
  if (p.includes('gallery') || p.includes('photography')) return buildGallery(prompt);

  // Default: generic landing
  return buildGeneric(prompt);
}

    background: #0a0a0f;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background-image: radial-gradient(circle at 50% 50%, rgba(99,102,241,.15), transparent 60%);
  }
  .container { text-align: center; max-width: 600px; }
  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    background: linear-gradient(135deg, #a5b4fc, #c084fc);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
  }
  p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2.5rem; }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }
  .box {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    min-width: 90px;
  }
  .box .num { font-size: 2.2rem; font-weight: 700; color: #a5b4fc; }
  .box .label { font-size: .7rem; color: #64748b; text-transform: uppercase; letter-spacing: .1em; margin-top: .3rem; }

  form { display: flex; gap: .5rem; max-width: 420px; margin: 0 auto; }
  input {
    flex: 1;
    padding: .9rem 1rem;
    background: rgba(0,0,0,.4);
    border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 12px;
    color: white;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #818cf8; }
  button {
    padding: .9rem 1.5rem;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <p>${prompt}</p>

    <div class="countdown">
      <div class="box"><div class="num" id="days">00</div><div class="label">Days</div></div>
      <div class="box"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
      <div class="box"><div class="num" id="mins">00</div><div class="label">Mins</div></div>
      <div class="box"><div class="num" id="secs">00</div><div class="label">Secs</div></div>
    </div>

    <form onsubmit="event.preventDefault(); alert('Subscribed!');">
      <input type="email" placeholder="your@email.com" required>
      <button type="submit">Notify Me</button>
    </form>
  </div>

  <script>
    const target = new Date();
    target.setDate(target.getDate() + 30);
    function tick() {
      const now = new Date();
      const diff = target - now;
      if (diff <= 0) return;
      document.getElementById('days').textContent  = String(Math.floor(diff / 86400000)).padStart(2,'0');
      document.getElementById('hours').textContent = String(Math.floor(diff / 3600000) % 24).padStart(2,'0');
      document.getElementById('mins').textContent  = String(Math.floor(diff / 60000) % 60).padStart(2,'0');
      document.getElementById('secs').textContent  = String(Math.floor(diff / 1000) % 60).padStart(2,'0');
    }
    setInterval(tick, 1000); tick();
  <\/script>
</body>
</html>`;
}

/* AI Generate Button */
$('aiGenerateBtn').addEventListener('click', () => {
  const prompt = $('aiPrompt').value.trim();
  if (!prompt) { toast('Describe your website first', true); return; }

  $('aiGenerateBtn').disabled = true;
  $('aiGenerateBtn').innerHTML = '<div class="spinner"></div> Generating...';

  setTimeout(() => {
    const code = generateWebsite(prompt);
    $('aiCode').value = code;
    $('aiOutputCard').style.display = 'block';
    $('aiOutputCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('Website generated!');

    $('aiGenerateBtn').disabled = false;
    $('aiGenerateBtn').innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Website';
  }, 700);
});

/* AI Clear */
$('aiClearBtn').addEventListener('click', () => {
  $('aiPrompt').value = '';
  $('aiCode').value = '';
  $('aiOutputCard').style.display = 'none';
  $('aiPreviewBox').classList.remove('show');
  toast('Cleared');
});

/* AI Preview */
$('aiPreviewBtn').addEventListener('click', () => {
  const code = $('aiCode').value;
  if (!code.trim()) { toast('No code to preview', true); return; }
  $('aiPreviewFrame').srcdoc = code;
  $('aiPreviewBox').classList.add('show');
  $('aiPreviewBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  toast('Preview loaded');
});
$('aiClosePreview').addEventListener('click', () => {
  $('aiPreviewBox').classList.remove('show');
  $('aiPreviewFrame').srcdoc = '';
});

/* AI Auto-Paste to Deploy */
$('aiTempelBtn').addEventListener('click', () => {
  const code = $('aiCode').value;
  const prompt = $('aiPrompt').value.trim();
  if (!code) { toast('No code to paste', true); return; }

  // Switch to Deploy tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="deploy"]').classList.add('active');
  $('panel-deploy').classList.add('active');

  // Fill in code
  $('siteCode').value = code;

  // Suggest a name from prompt
  if (!$('siteName').value) {
    const suggested = prompt.toLowerCase()
      .replace(/[^a-z0-9\s]/g, '')
      .split(/\s+/)
      .slice(0, 3)
      .join('-');
    $('siteName').value = suggested || 'my-website';
  }

  toast('Pasted to Deploy! Check preview.');
  log(`🤖 AI code auto-pasted to Deploy tab.`, 'success');
  $('siteCode').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* AI Deploy Now */
$('aiDeployBtn').addEventListener('click', async () => {
  const token = $('token').value.trim();
  const code  = $('aiCode').value;
  const prompt = $('aiPrompt').value.trim();

  if (!token) {
    toast('Enter token in Deploy tab first', true);
    // Switch to deploy
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector('[data-tab="deploy"]').classList.add('active');
    $('panel-deploy').classList.add('active');
    $('token').focus();
    return;
  }
  if (!code) { toast('No code to deploy', true); return; }

  // Auto-fill site name if empty
  if (!$('siteName').value) {
    const suggested = prompt.toLowerCase()
      .replace(/[^a-z0-9\s]/g, '')
      .split(/\s+/)
      .slice(0, 3)
      .join('-');
    $('siteName').value = suggested || 'my-website';
  }

  // Switch to deploy to show console
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('[data-tab="deploy"]').classList.add('active');
  $('panel-deploy').classList.add('active');

  // Set code
  $('siteCode').value = code;

  // Trigger deploy
  $('deployBtn').click();
});
